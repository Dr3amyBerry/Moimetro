name: API tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline integration tests
        run: python -m pytest -q
      - name: Check JavaScript syntax
        run: node --check app/static/app.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Create fake build credentials
        run: cp firmware/include/secrets.example.h firmware/include/secrets.h
      - name: Test SpO2 estimator on synthetic signals (native C++)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/test_spo2_estimator.cpp -o /tmp/moimetro-spo2-test
          /tmp/moimetro-spo2-test
      - name: Compile ESP32 firmware
        run: pio run -d firmware
