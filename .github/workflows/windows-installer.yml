name: Instaladores Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'requirements-win7*.txt'
      - 'requirements-dev.txt'
      - 'tests/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}-v2
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: legacy-x86
            python: '3.8'
            architecture: x86
            requirements: requirements-win7-dev.txt
            pyinstaller: '5.13.2'
            flavor: legacy
          - target: legacy-x64
            python: '3.8'
            architecture: x64
            requirements: requirements-win7-dev.txt
            pyinstaller: '5.13.2'
            flavor: legacy
          - target: modern-x64
            python: '3.11'
            architecture: x64
            requirements: requirements-dev.txt
            pyinstaller: '6.15.0'
            flavor: modern

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install -r "${{ matrix.requirements }}"
          python -m pip install "pyinstaller==${{ matrix.pyinstaller }}"

      - name: Probar API y compatibilidad Python
        shell: pwsh
        run: python -m pytest -q

      - name: Empaquetar aplicación con Python incluido
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name "Moimetro" `
            --add-data "app/static;app/static" `
            --collect-submodules "uvicorn" `
            --hidden-import "app.main" `
            app/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Error de PyInstaller" }
          if (!(Test-Path "dist/Moimetro/Moimetro.exe")) {
            throw "No se generó Moimetro.exe"
          }

      - name: Probar ejecutable sin abrir interfaz
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/Moimetro/Moimetro.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru
          if (!$proc.WaitForExit(30000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "El EXE no finalizó la prueba en 30 segundos"
          }
          $logfile = Join-Path $env:TEMP "Moimetro-selftest-error.log"
          if (Test-Path $logfile) { Get-Content $logfile }
          if ($proc.ExitCode -ne 0) { throw "El EXE falló: $($proc.ExitCode)" }

      - name: Instalar compilador de instaladores
        shell: pwsh
        run: |
          choco install innosetup --version=6.2.2 -y --allow-downgrade --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }

      - name: Crear instalador .exe
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            $compiler = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $compiler)) { throw "No se encontró ISCC.exe" }
          & $compiler "/DBuildRoot=$env:GITHUB_WORKSPACE" `
            "/DArch=${{ matrix.architecture }}" `
            "/DFlavor=${{ matrix.flavor }}" `
            "packaging\windows\Moimetro.iss"
          if ($LASTEXITCODE -ne 0) { throw "No se compiló el instalador" }
          $exe = Get-ChildItem "dist/installer/*.exe" | Select-Object -First 1
          if (!$exe) { throw "No se creó el instalador" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLower()
          "$hash *$($exe.Name)" | Out-File -Encoding ascii "dist/installer/SHA256SUMS.txt"

      - name: Verificar nombre español y accesos directos instalados
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/installer/Moimetro-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "No se encontró el instalador para probar" }
          $product = ([System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer.FullName).ProductName).TrimEnd()
          if ($product -cne "Moímetro") {
            throw "Nombre del instalador corrupto: $product"
          }
          $desktopDir = [Environment]::GetFolderPath("DesktopDirectory")
          $startDir = [Environment]::GetFolderPath("Programs")
          $oldDesktop = Join-Path $desktopDir "MoÃ­metro.lnk"
          [System.IO.File]::WriteAllText($oldDesktop, "legacy name from previous installer")
          $arguments = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
            "/TASKS=desktopicon", "/DIR=$env:RUNNER_TEMP\Moimetro-Smoke")
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -PassThru -Wait
          if ($installed.ExitCode -ne 0) {
            throw "Instalador falló al ejecutarse: $($installed.ExitCode)"
          }
          $desktopLink = Join-Path $desktopDir "Moímetro.lnk"
          $startLink = Join-Path $startDir "Moímetro.lnk"
          if (!(Test-Path -LiteralPath $desktopLink)) {
            throw "El acceso directo del escritorio no se llama Moímetro"
          }
          if (!(Test-Path -LiteralPath $startLink)) {
            throw "El acceso directo de Inicio no se llama Moímetro"
          }
          if (Test-Path -LiteralPath $oldDesktop) {
            throw "No se eliminó el acceso directo antiguo con nombre corrupto"
          }

      - name: Publicar instalador descargable
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publicar tres instaladores en Releases
    needs: package
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: Moimetro v0.3.0-beta.1') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Crear SHA256 consolidado de los tres instaladores
        run: |
          cd installers
          test "$(find . -maxdepth 1 -name 'Moimetro-Setup-*.exe' | wc -l)" -eq 3
          sha256sum Moimetro-Setup-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.3.0-beta.1' }}
          name: 'Moímetro v0.3.0 beta — Windows'
          target_commitish: ${{ github.sha }}
          files: |
            installers/*.exe
            installers/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Versión beta de Moímetro para pruebas con datos ficticios.

            Instaladores disponibles:
            - `Moimetro-Setup-legacy-x86.exe` — Windows 7 SP1+ (32 bits).
            - `Moimetro-Setup-legacy-x64.exe` — Windows 7 SP1+ (64 bits).
            - `Moimetro-Setup-modern-x64.exe` — Windows 8.1+ (64 bits).

            Incluye gestión de cuentas/roles, revocación de sesiones, cambio de contraseña, interfaz clínica y revisiones de expedientes.

            Las versiones legacy (Windows 7 y Python 3.8) son software sin soporte de seguridad. No se autoriza utilizar esta beta para historias clínicas reales ni decisiones médicas. La validación física de Windows 7 y de sensores está pendiente.
